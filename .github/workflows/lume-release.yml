name: Build and publish Lume IPA + AltStore source

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lume-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Check out Lume
        uses: actions/checkout@v4
        with:
          repository: 6days9weeks/Lume
          ref: main
          path: Lume
          token: ${{ secrets.MIRROR_REPO_TOKEN }}

      - name: Check out LumeEngine beside Lume
        uses: actions/checkout@v4
        with:
          repository: bilipp/LumeEngine
          ref: main
          path: LumeEngine

      - name: Check out LumeRecorder beside Lume
        uses: actions/checkout@v4
        with:
          repository: bilipp/LumeRecorder
          ref: main
          path: LumeRecorder

      - name: Check out LumeCloud beside Lume
        uses: actions/checkout@v4
        with:
          repository: bilipp/LumeCloud
          ref: main
          path: LumeCloud

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Apply build compatibility patches
        working-directory: Lume
        run: |
          python3 -c 'from pathlib import Path; p=Path("Lume/Views/Series/SeriesDetailView.swift"); s=p.read_text(); original="                    withAnimation(.easeInOut(duration: 0.3)) {\n                        isLoadingTMDB = false\n                    }\n"; split="                    let loadingAnimation = Animation.easeInOut(duration: 0.3)\n                    withAnimation(loadingAnimation) {\n                        isLoadingTMDB = false\n                    }\n"; replacement="                    isLoadingTMDB = false\n"; assert original in s or split in s, f"Expected patch not found in {p}"; s=s.replace(original, replacement, 1); s=s.replace(split, replacement, 1); p.write_text(s)'

      - name: Resolve Swift packages
        working-directory: Lume
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Lume.xcodeproj \
            -scheme Lume

      - name: Build unsigned app
        working-directory: Lume
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Lume.xcodeproj \
            -scheme Lume \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package IPA and generate AltStore JSON
        id: metadata
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Lume.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Lume.app"
          (cd "$RUNNER_TEMP/ipa" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Lume.ipa")

          INFO="$APP/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
          TAG="build-${RUN_NUMBER}-${SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"

          python3 scripts/generate_altstore.py \
            --info-plist "$INFO" \
            --output "$GITHUB_WORKSPACE/altstore.json" \
            --repository "6days9weeks/Lume" \
            --tag "$TAG" \
            --build-number "$RUN_NUMBER" \
            --ipa-size "$(stat -f%z "$GITHUB_WORKSPACE/Lume.ipa")"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: 6days9weeks/Lume
          token: ${{ secrets.MIRROR_REPO_TOKEN }}
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: Lume ${{ steps.metadata.outputs.version }} (build ${{ steps.metadata.outputs.build }})
          body: |
            Automated unsigned iOS build from upstream Lume.
            Install with AltStore Classic or SideStore using your Apple ID.
          files: Lume.ipa
          make_latest: true
          generate_release_notes: true

      - name: Publish AltStore source to GitHub Pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p site
          cp altstore.json site/altstore.json
          cat > site/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>6days9weeks Lume AltStore Source</title></head>
          <body style="font-family:system-ui;max-width:700px;margin:3rem auto;padding:0 1rem">
          <h1>Lume AltStore Source</h1><p>Automated builds of Lume for iPhone.</p>
          <p><a href="altstore.json">Open AltStore source JSON</a></p>
          <p>Add this source in AltStore Classic:</p><code>https://6days9weeks.github.io/lume-automation/altstore.json</code>
          </body></html>
          EOF
          cd site
          git init
          git checkout -b gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Publish AltStore source"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/6days9weeks/lume-automation.git"
          git push --force origin gh-pages

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lume-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
